<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム 航空機ライブトラッカー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom map styling and animations */
        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
            background-color: #0f172a;
        }

        /* Plane Icon Smooth Transition */
        .leaflet-marker-icon.plane-icon {
            transition: transform 0.5s ease-out;
            background: transparent;
            border: none;
        }

        /* Pulse effect for selected aircraft */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        .selected-pulse {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #3b82f6;
            animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            pointer-events: none;
        }

        /* Dark Theme Map Tiles filter adjustment */
        .dark-tiles .leaflet-tile-container img {
            filter: brightness(0.7) invert(1) contrast(1.2) hue-rotate(200deg) saturate(0.3);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased overflow-hidden">

    <div class="relative w-full h-screen flex flex-col md:flex-row">

        <!-- Top Header & Search Bar (Mobile & Desktop Overlay) -->
        <header class="absolute top-4 left-4 right-4 z-20 md:w-96 flex flex-col gap-2 pointer-events-auto">
            <div class="bg-slate-900/90 backdrop-blur-md border border-slate-800 p-4 rounded-xl shadow-2xl flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <div class="p-2 bg-blue-600/20 text-blue-400 rounded-lg">
                            <i data-lucide="plane-takeoff" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h1 class="text-base font-bold tracking-wide text-white">Live Flight Tracker</h1>
                            <p class="text-xs text-slate-400">OpenSky Network ライブ連動</p>
                        </div>
                    </div>
                    <span id="status-badge" class="flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 font-medium">
                        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                        更新準備中
                    </span>
                </div>

                <!-- Search Input -->
                <div class="relative flex items-center">
                    <i data-lucide="search" class="absolute left-3 w-4 h-4 text-slate-400"></i>
                    <input type="text" id="search-input" placeholder="コールサインで検索 (例: ANA, JAL, AAL)..."
                           class="w-full bg-slate-800/80 border border-slate-700/80 rounded-lg pl-9 pr-8 py-2 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                    <button id="clear-search" class="absolute right-2 text-slate-400 hover:text-white hidden">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>

                <!-- Preset Area Buttons -->
                <div class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs text-slate-300">
                    <span class="text-slate-500 text-[10px] uppercase font-bold shrink-0">プリセット:</span>
                    <button onclick="flyToLocation(35.6762, 139.6503, 7)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded transition whitespace-nowrap">日本全域</button>
                    <button onclick="flyToLocation(35.5494, 139.7798, 10)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded transition whitespace-nowrap">羽田/成田</button>
                    <button onclick="flyToLocation(34.4320, 135.2304, 10)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded transition whitespace-nowrap">関西/伊丹</button>
                    <button onclick="flyToLocation(51.5074, -0.1278, 6)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded transition whitespace-nowrap">欧州</button>
                    <button onclick="flyToLocation(40.7128, -74.0060, 6)" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded transition whitespace-nowrap">北米</button>
                </div>
            </div>
        </header>

        <!-- Map Canvas Container -->
        <div class="relative flex-grow h-full w-full">
            <div id="map"></div>

            <!-- Stats Bar Overlay (Bottom Left) -->
            <div class="absolute bottom-6 left-4 z-20 pointer-events-auto bg-slate-900/80 backdrop-blur-md border border-slate-800 px-4 py-2.5 rounded-lg shadow-lg flex items-center gap-4 text-xs">
                <div class="flex items-center gap-1.5">
                    <i data-lucide="plane" class="w-4 h-4 text-blue-400"></i>
                    <span>表示中機体: <strong id="flight-count" class="text-blue-400 font-bold">0</strong> 機</span>
                </div>
                <div class="h-3 w-px bg-slate-700"></div>
                <div class="flex items-center gap-1.5 text-slate-400">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                    <span>自動更新: <span id="countdown">15</span>s</span>
                </div>
            </div>

            <!-- Map Layer Toggle (Bottom Right) -->
            <div class="absolute bottom-6 right-4 z-20 pointer-events-auto flex gap-2">
                <button id="toggle-layer" class="bg-slate-900/90 hover:bg-slate-800 border border-slate-800 p-2.5 rounded-lg text-slate-300 hover:text-white shadow-lg transition flex items-center gap-2 text-xs font-medium">
                    <i data-lucide="layers" class="w-4 h-4"></i>
                    <span id="layer-name">ダークモード</span>
                </button>
                <button id="manual-refresh" class="bg-blue-600 hover:bg-blue-500 border border-blue-500 p-2.5 rounded-lg text-white shadow-lg transition flex items-center gap-1.5 text-xs font-medium">
                    <i data-lucide="rotate-cw" class="w-4 h-4"></i>
                    <span>再読み込み</span>
                </button>
            </div>
        </div>

        <!-- Flight Detail Sidebar (Right Desktop / Bottom Sheet Mobile) -->
        <aside id="detail-panel" class="absolute right-4 top-4 bottom-4 z-30 w-full max-w-sm bg-slate-900/95 backdrop-blur-md border border-slate-800 rounded-xl shadow-2xl p-5 flex flex-col justify-between transform translate-x-[115%] transition-transform duration-300 pointer-events-auto">
            <div>
                <!-- Panel Header -->
                <div class="flex items-start justify-between border-b border-slate-800 pb-3 mb-4">
                    <div>
                        <span class="text-xs uppercase tracking-wider font-semibold text-blue-400">Flight Details</span>
                        <h2 id="detail-callsign" class="text-2xl font-black tracking-tight text-white mt-0.5">---</h2>
                        <p id="detail-country" class="text-xs text-slate-400">---</p>
                    </div>
                    <button onclick="closeDetailPanel()" class="text-slate-400 hover:text-white p-1 rounded-lg bg-slate-800 hover:bg-slate-700 transition">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- Aircraft Main Metrics Grid -->
                <div class="grid grid-cols-2 gap-3 mb-5">
                    <div class="bg-slate-800/50 border border-slate-700/50 p-3 rounded-lg">
                        <div class="flex items-center gap-1.5 text-slate-400 text-xs mb-1">
                            <i data-lucide="arrow-up-right" class="w-3.5 h-3.5 text-emerald-400"></i>
                            高度 (Altitude)
                        </div>
                        <span id="detail-altitude" class="text-lg font-bold text-slate-100">---</span>
                    </div>
                    <div class="bg-slate-800/50 border border-slate-700/50 p-3 rounded-lg">
                        <div class="flex items-center gap-1.5 text-slate-400 text-xs mb-1">
                            <i data-lucide="gauge" class="w-3.5 h-3.5 text-amber-400"></i>
                            速度 (Speed)
                        </div>
                        <span id="detail-velocity" class="text-lg font-bold text-slate-100">---</span>
                    </div>
                    <div class="bg-slate-800/50 border border-slate-700/50 p-3 rounded-lg">
                        <div class="flex items-center gap-1.5 text-slate-400 text-xs mb-1">
                            <i data-lucide="compass" class="w-3.5 h-3.5 text-sky-400"></i>
                            方角 (Heading)
                        </div>
                        <span id="detail-heading" class="text-lg font-bold text-slate-100">---</span>
                    </div>
                    <div class="bg-slate-800/50 border border-slate-700/50 p-3 rounded-lg">
                        <div class="flex items-center gap-1.5 text-slate-400 text-xs mb-1">
                            <i data-lucide="trending-up" class="w-3.5 h-3.5 text-indigo-400"></i>
                            昇降率 (Vertical)
                        </div>
                        <span id="detail-vertical" class="text-lg font-bold text-slate-100">---</span>
                    </div>
                </div>

                <!-- Technical Properties List -->
                <div class="space-y-2.5 text-xs">
                    <div class="flex justify-between py-1.5 border-b border-slate-800/80">
                        <span class="text-slate-400">ICAO24 識別子</span>
                        <span id="detail-icao" class="font-mono text-slate-200">---</span>
                    </div>
                    <div class="flex justify-between py-1.5 border-b border-slate-800/80">
                        <span class="text-slate-400">緯度 / 経度</span>
                        <span id="detail-latlon" class="font-mono text-slate-200">---</span>
                    </div>
                    <div class="flex justify-between py-1.5 border-b border-slate-800/80">
                        <span class="text-slate-400">スクオーク (Squawk)</span>
                        <span id="detail-squawk" class="font-mono text-slate-200">---</span>
                    </div>
                    <div class="flex justify-between py-1.5 border-b border-slate-800/80">
                        <span class="text-slate-400">地上追跡状態</span>
                        <span id="detail-onground" class="text-slate-200">---</span>
                    </div>
                </div>
            </div>

            <!-- Panel Actions -->
            <div class="mt-4 pt-3 border-t border-slate-800 flex gap-2">
                <button id="track-btn" onclick="toggleTrackAircraft()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition">
                    <i data-lucide="crosshair" class="w-4 h-4"></i>
                    <span id="track-btn-text">機体を追跡フォーカス</span>
                </button>
            </div>
        </aside>

    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Application State Management
        const state = {
            map: null,
            markers: {},
            flightData: {},
            selectedIcao: null,
            isTrackingSelected: false,
            darkTileLayer: null,
            lightTileLayer: null,
            isDarkMode: true,
            updateIntervalSeconds: 15,
            countdownTimer: 15,
            timerId: null,
            isFetching: false
        };

        // OpenSky State Matrix Indices
        const OPENSKY = {
            ICAO24: 0,
            CALLSIGN: 1,
            COUNTRY: 2,
            LONGITUDE: 5,
            LATITUDE: 6,
            BARO_ALTITUDE: 7,
            ON_GROUND: 8,
            VELOCITY: 9,
            TRUE_TRACK: 10,
            VERTICAL_RATE: 11,
            GEO_ALTITUDE: 13,
            SQUAWK: 14
        };

        // Initialize Application on Window Load
        window.onload = function() {
            initMap();
            setupEventListeners();
            fetchFlightData();
            startCountdown();
        };

        function initMap() {
            // Default center: Japan Region
            state.map = L.map('map', {
                center: [35.6762, 139.6503],
                zoom: 7,
                zoomControl: false
            });

            // Re-position zoom controls to bottom right area
            L.control.zoom({ position: 'topright' }).addTo(state.map);

            // Light & Dark Tile Layers
            state.darkTileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
                className: 'dark-tiles',
                maxZoom: 18
            });

            state.lightTileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
                maxZoom: 18
            });

            state.darkTileLayer.addTo(state.map);

            // Click on map empty space closes detail panel
            state.map.on('click', (e) => {
                if (!e.originalEvent._stopped) {
                    closeDetailPanel();
                }
            });
        }

        // SVG Plane Marker Builder
        function createPlaneSvgIcon(heading = 0, isSelected = false) {
            const color = isSelected ? '#3b82f6' : '#e2e8f0';
            const strokeColor = isSelected ? '#1d4ed8' : '#0f172a';
            const size = isSelected ? 36 : 28;

            const svg = `
                <div style="transform: rotate(${heading}deg); transition: transform 0.4s ease; width: ${size}px; height: ${size}px;" class="flex items-center justify-center">
                    ${isSelected ? '<div class="selected-pulse"></div>' : ''}
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="${color}" stroke="${strokeColor}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" style="width:100%; height:100%; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));">
                        <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.7 5.2c.3.4.8.5 1.3.3l.5-.3c.4-.2.6-.6.5-1.1z"/>
                    </svg>
                </div>
            `;

            return L.divIcon({
                html: svg,
                className: 'plane-icon',
                iconSize: [size, size],
                iconAnchor: [size / 2, size / 2]
            });
        }

        async function fetchFlightData() {
            if (state.isFetching) return;
            state.isFetching = true;

            const statusBadge = document.getElementById('status-badge');
            statusBadge.className = "flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20 font-medium";
            statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-400 animate-ping"></span>受信中...`;

            try {
                // Fetch current map bounds to load flights in viewport (prevents overloading API and browser)
                const bounds = state.map.getBounds();
                const lamin = Math.max(-90, bounds.getSouth() - 1);
                const lomin = Math.max(-180, bounds.getWest() - 1);
                const lamax = Math.min(90, bounds.getNorth() + 1);
                const lomax = Math.min(180, bounds.getEast() + 1);

                const url = `https://opensky-network.org/api/states/all?lamin=${lamin.toFixed(2)}&lomin=${lomin.toFixed(2)}&lamax=${lamax.toFixed(2)}&lomax=${lomax.toFixed(2)}`;

                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                const data = await response.json();
                processFlightStates(data.states || []);

                statusBadge.className = "flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium";
                statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span>LIVE`;

            } catch (error) {
                console.warn("OpenSky API direct fetch failed/limited, using localized simulation fallback if needed.", error);
                
                statusBadge.className = "flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 font-medium";
                statusBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span>制限モード (全地域データ)`;

                // Fallback attempt without bounds if bounded request is throttled
                try {
                    const fallbackResp = await fetch('https://opensky-network.org/api/states/all');
                    const fallbackData = await fallbackResp.json();
                    if (fallbackData.states) {
                        // Filter flights in bounds manually
                        const filtered = fallbackData.states.filter(s => {
                            const lat = s[OPENSKY.LATITUDE];
                            const lon = s[OPENSKY.LONGITUDE];
                            return lat && lon && lat >= bounds.getSouth() && lat <= bounds.getNorth() && lon >= bounds.getWest() && lon <= bounds.getEast();
                        });
                        processFlightStates(filtered);
                    }
                } catch(e) {
                    console.error("API Fetch error:", e);
                }
            } finally {
                state.isFetching = false;
                state.countdownTimer = state.updateIntervalSeconds;
            }
        }

        function processFlightStates(states) {
            const currentIcaos = new Set();
            let visibleCount = 0;

            states.forEach(flight => {
                const icao = flight[OPENSKY.ICAO24];
                const lat = flight[OPENSKY.LATITUDE];
                const lon = flight[OPENSKY.LONGITUDE];
                const heading = flight[OPENSKY.TRUE_TRACK] || 0;

                if (!lat || !lon) return;

                currentIcaos.add(icao);
                visibleCount++;

                state.flightData[icao] = flight;

                const isSelected = (icao === state.selectedIcao);

                if (state.markers[icao]) {
                    // Update Marker Position and Orientation
                    const marker = state.markers[icao];
                    marker.setLatLng([lat, lon]);
                    marker.setIcon(createPlaneSvgIcon(heading, isSelected));
                } else {
                    // Create New Marker
                    const marker = L.marker([lat, lon], {
                        icon: createPlaneSvgIcon(heading, isSelected)
                    }).addTo(state.map);

                    marker.on('click', (e) => {
                        L.DomEvent.stopPropagation(e);
                        selectAircraft(icao);
                    });

                    state.markers[icao] = marker;
                }
            });

            // Clean up markers no longer visible/transmitted
            Object.keys(state.markers).forEach(icao => {
                if (!currentIcaos.has(icao)) {
                    state.map.removeLayer(state.markers[icao]);
                    delete state.markers[icao];
                    delete state.flightData[icao];
                }
            });

            document.getElementById('flight-count').innerText = visibleCount;

            // Auto center selected tracked flight
            if (state.selectedIcao && state.isTrackingSelected && state.flightData[state.selectedIcao]) {
                const selFlight = state.flightData[state.selectedIcao];
                state.map.panTo([selFlight[OPENSKY.LATITUDE], selFlight[OPENSKY.LONGITUDE]]);
            }

            // Update details panel if open
            if (state.selectedIcao && state.flightData[state.selectedIcao]) {
                updateDetailPanelContent(state.flightData[state.selectedIcao]);
            }
        }

        function selectAircraft(icao) {
            const prevSelected = state.selectedIcao;
            state.selectedIcao = icao;

            // Reset previous selected marker icon
            if (prevSelected && state.markers[prevSelected] && state.flightData[prevSelected]) {
                const prevHeading = state.flightData[prevSelected][OPENSKY.TRUE_TRACK] || 0;
                state.markers[prevSelected].setIcon(createPlaneSvgIcon(prevHeading, false));
            }

            // Highlight newly selected marker
            if (state.markers[icao] && state.flightData[icao]) {
                const flight = state.flightData[icao];
                const heading = flight[OPENSKY.TRUE_TRACK] || 0;
                state.markers[icao].setIcon(createPlaneSvgIcon(heading, true));

                // Pan map to aircraft
                state.map.animateTo ? state.map.animateTo([flight[OPENSKY.LATITUDE], flight[OPENSKY.LONGITUDE]]) : state.map.panTo([flight[OPENSKY.LATITUDE], flight[OPENSKY.LONGITUDE]]);

                updateDetailPanelContent(flight);
                openDetailPanel();
            }
        }

        function updateDetailPanelContent(flight) {
            const callsign = flight[OPENSKY.CALLSIGN] ? flight[OPENSKY.CALLSIGN].trim() : 'N/A';
            const country = flight[OPENSKY.COUNTRY] || '不明';
            const altitude = flight[OPENSKY.BARO_ALTITUDE] !== null ? `${Math.round(flight[OPENSKY.BARO_ALTITUDE])} m (${Math.round(flight[OPENSKY.BARO_ALTITUDE] * 3.28084)} ft)` : 'データなし';
            const velocity = flight[OPENSKY.VELOCITY] !== null ? `${Math.round(flight[OPENSKY.VELOCITY] * 3.6)} km/h (${Math.round(flight[OPENSKY.VELOCITY] * 1.94384)} kts)` : 'データなし';
            const heading = flight[OPENSKY.TRUE_TRACK] !== null ? `${Math.round(flight[OPENSKY.TRUE_TRACK])}°` : '---';
            const vertical = flight[OPENSKY.VERTICAL_RATE] !== null ? `${flight[OPENSKY.VERTICAL_RATE] > 0 ? '+' : ''}${flight[OPENSKY.VERTICAL_RATE].toFixed(1)} m/s` : '平空飛行';
            const icao = flight[OPENSKY.ICAO24].toUpperCase();
            const latlon = `${flight[OPENSKY.LATITUDE].toFixed(4)}, ${flight[OPENSKY.LONGITUDE].toFixed(4)}`;
            const squawk = flight[OPENSKY.SQUAWK] || '未設定';
            const onGround = flight[OPENSKY.ON_GROUND] ? '地上走行中' : '飛行中';

            document.getElementById('detail-callsign').innerText = callsign !== 'N/A' ? callsign : `機体 (${icao})`;
            document.getElementById('detail-country').innerText = `国籍 / 登録国: ${country}`;
            document.getElementById('detail-altitude').innerText = altitude;
            document.getElementById('detail-velocity').innerText = velocity;
            document.getElementById('detail-heading').innerText = heading;
            document.getElementById('detail-vertical').innerText = vertical;
            document.getElementById('detail-icao').innerText = icao;
            document.getElementById('detail-latlon').innerText = latlon;
            document.getElementById('detail-squawk').innerText = squawk;
            document.getElementById('detail-onground').innerText = onGround;
        }

        function openDetailPanel() {
            document.getElementById('detail-panel').classList.remove('translate-x-[115%]');
        }

        function closeDetailPanel() {
            document.getElementById('detail-panel').classList.add('translate-x-[115%]');
            
            if (state.selectedIcao && state.markers[state.selectedIcao] && state.flightData[state.selectedIcao]) {
                const heading = state.flightData[state.selectedIcao][OPENSKY.TRUE_TRACK] || 0;
                state.markers[state.selectedIcao].setIcon(createPlaneSvgIcon(heading, false));
            }
            state.selectedIcao = null;
            state.isTrackingSelected = false;
            updateTrackButtonUI();
        }

        function toggleTrackAircraft() {
            state.isTrackingSelected = !state.isTrackingSelected;
            updateTrackButtonUI();

            if (state.isTrackingSelected && state.selectedIcao && state.flightData[state.selectedIcao]) {
                const flight = state.flightData[state.selectedIcao];
                state.map.panTo([flight[OPENSKY.LATITUDE], flight[OPENSKY.LONGITUDE]]);
            }
        }

        function updateTrackButtonUI() {
            const btn = document.getElementById('track-btn');
            const text = document.getElementById('track-btn-text');

            if (state.isTrackingSelected) {
                btn.className = "w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition";
                text.innerText = "追跡フォーカス中 (解除)";
            } else {
                btn.className = "w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 transition";
                text.innerText = "機体を追跡フォーカス";
            }
        }

        function setupEventListeners() {
            // Manual Refresh Button
            document.getElementById('manual-refresh').addEventListener('click', () => {
                fetchFlightData();
            });

            // Layer Toggle Button
            document.getElementById('toggle-layer').addEventListener('click', () => {
                state.isDarkMode = !state.isDarkMode;
                if (state.isDarkMode) {
                    state.map.removeLayer(state.lightTileLayer);
                    state.darkTileLayer.addTo(state.map);
                    document.getElementById('layer-name').innerText = 'ダークモード';
                } else {
                    state.map.removeLayer(state.darkTileLayer);
                    state.lightTileLayer.addTo(state.map);
                    document.getElementById('layer-name').innerText = 'ライトモード';
                }
            });

            // Callsign Search Logic
            const searchInput = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-search');

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim().toUpperCase();
                clearBtn.classList.toggle('hidden', query.length === 0);

                if (query.length >= 2) {
                    // Find matching callsign or ICAO
                    const matchedIcao = Object.keys(state.flightData).find(icao => {
                        const callsign = (state.flightData[icao][OPENSKY.CALLSIGN] || '').trim().toUpperCase();
                        return callsign.includes(query) || icao.toUpperCase().includes(query);
                    });

                    if (matchedIcao) {
                        selectAircraft(matchedIcao);
                    }
                }
            });

            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearBtn.classList.add('hidden');
            });

            // Map drag ends tracking mode
            state.map.on('dragstart', () => {
                if (state.isTrackingSelected) {
                    state.isTrackingSelected = false;
                    updateTrackButtonUI();
                }
            });

            // Map zoom/move re-fetches flights for new bounds
            state.map.on('moveend', () => {
                fetchFlightData();
            });
        }

        // Map FlyTo Helper for Preset Navigation
        function flyToLocation(lat, lon, zoom) {
            state.map.flyTo([lat, lon], zoom, { duration: 1.5 });
        }

        // Countdown Timer Loop
        function startCountdown() {
            state.timerId = setInterval(() => {
                state.countdownTimer--;
                if (state.countdownTimer <= 0) {
                    fetchFlightData();
                } else {
                    document.getElementById('countdown').innerText = state.countdownTimer;
                }
            }, 1000);
        }
    </script>
</body>
</html>
