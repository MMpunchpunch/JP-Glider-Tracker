<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>妻沼滑空場 機体監視システム (Menuma Glider Tracker)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        #map { z-index: 10; }
        /* カスタムアイコンのスタイル */
        .aircraft-icon {
            transition: all 1s linear;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
        }
        .aircraft-icon svg {
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
        }
        /* Leafletコントロールをダークモードに合わせる */
        .leaflet-control-zoom a {
            background-color: #1e293b !important;
            color: #f8fafc !important;
            border-color: #334155 !important;
        }
        .leaflet-control-layers {
            background-color: #1e293b !important;
            color: #f8fafc !important;
            border-color: #334155 !important;
            border-radius: 8px !important;
        }
        .leaflet-control-layers-base label {
            color: #f8fafc !important;
        }
        /* アニメーション・トランジション */
        .playback-slider::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
        }
        /* カスタムスクロールバー */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 overflow-hidden flex h-screen w-screen relative">

    <!-- モバイル背景オーバーレイ -->
    <div id="sidebar-overlay" onclick="toggleSidebar(false)" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-30 transition-opacity md:hidden"></div>

    <!-- サイドバー (機体リスト) -->
    <aside id="sidebar" class="fixed md:relative top-0 left-0 h-full w-80 bg-slate-900 border-r border-slate-700 flex flex-col z-40 shadow-2xl transition-transform duration-300 ease-in-out -translate-x-full md:translate-x-0 flex-shrink-0">
        <!-- サイドバー収納矢印ボタン（サイドバー内部右上） -->
        <button onclick="toggleSidebar(false)" title="サイドバーをたたむ" class="absolute top-4 right-3 text-slate-400 hover:text-white bg-slate-800/80 hover:bg-slate-700 p-1.5 rounded-lg border border-slate-700 transition-colors z-10">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path></svg>
        </button>

        <!-- ヘッダー -->
        <div class="p-4 md:p-5 border-b border-slate-800 bg-slate-950 flex justify-between items-start">
            <div>
                <h1 class="text-base md:text-lg font-bold text-sky-400 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Menuma Tracker
                </h1>
                <p class="text-[11px] text-slate-400 mt-0.5">妻沼滑空場 ライブ監視システム</p>
            </div>
        </div>

        <div class="p-3 border-b border-slate-800 bg-slate-950/50 flex items-center justify-between text-xs">
            <span class="flex items-center gap-1.5">
                <span class="relative flex h-2.5 w-2.5">
                    <span id="status-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span id="status-dot" class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                </span>
                <span id="system-status" class="font-medium">更新中...</span>
            </span>
            <span id="last-update" class="text-slate-500 font-mono">--:--:--</span>
        </div>

        <!-- 統計サマリー & フィルタ -->
        <div class="p-4 border-b border-slate-800 space-y-3">
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-slate-800/80 p-2.5 rounded-lg text-center border border-slate-700/50">
                    <p class="text-[11px] text-slate-400 mb-0.5">画面内機体数</p>
                    <p class="text-lg font-mono font-bold text-white" id="total-aircrafts">0</p>
                </div>
                <div class="bg-slate-800/80 p-2.5 rounded-lg text-center border border-slate-700/50">
                    <p class="text-[11px] text-slate-400 mb-0.5">データソース</p>
                    <p class="text-[11px] font-semibold text-sky-300 mt-1" id="data-source">OGN + ADS-B</p>
                </div>
            </div>

            <!-- 表示フィルター切り替え -->
            <div class="flex bg-slate-950 p-1 rounded-lg text-xs font-semibold">
                <button id="filter-all" onclick="setFilter('all')" class="flex-1 py-1 text-center rounded bg-sky-500 text-slate-950 transition-colors">すべて</button>
                <button id="filter-ogn" onclick="setFilter('ogn')" class="flex-1 py-1 text-center rounded text-slate-400 hover:text-white transition-colors">OGN</button>
                <button id="filter-adsb" onclick="setFilter('adsb')" class="flex-1 py-1 text-center rounded text-slate-400 hover:text-white transition-colors">ADS-B</button>
            </div>
        </div>

        <!-- 機体リストコンテナ (メインリスト) -->
        <div class="flex-1 overflow-y-auto p-2" id="sidebar-content-area">
            <div class="flex items-center justify-center h-full text-slate-500 text-sm">
                データ取得中...
            </div>
        </div>
    </aside>

    <!-- メインマップエリア -->
    <main class="flex-1 relative h-full w-full">
        <!-- サイドバー開く用のコンパクトな矢印引き出しタブボタン -->
        <button id="sidebar-open-btn" onclick="toggleSidebar(true)" title="サイドバーを開く" class="absolute top-4 left-0 z-[200] bg-slate-900/90 hover:bg-slate-800 text-sky-400 border border-l-0 border-slate-700 py-3 px-1.5 rounded-r-xl shadow-2xl transition-all flex items-center justify-center group active:scale-95">
            <svg id="sidebar-open-icon" class="w-5 h-5 transform group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path>
            </svg>
        </button>

        <div id="map" class="w-full h-full bg-slate-800"></div>

        <!-- プレイバック（タイムトラベル）コントロールバー -->
        <div id="playback-bar" class="hidden absolute bottom-6 left-1/2 transform -translate-x-1/2 z-[400] w-11/12 max-w-2xl bg-slate-900/95 backdrop-blur-md border border-slate-700 rounded-2xl shadow-2xl p-3 md:p-4 text-xs">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <span class="px-2 py-0.5 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded font-bold text-[10px] md:text-xs">再生モード</span>
                    <span id="pb-callsign" class="text-sm md:text-base font-bold text-white font-mono">JA2515</span>
                    <span id="pb-time-range" class="text-slate-400 font-mono text-[10px] md:text-[11px]">10:15:00 - 10:28:30</span>
                </div>
                <button onclick="exitPlayback()" class="text-slate-400 hover:text-white px-2 py-1 bg-slate-800 rounded hover:bg-slate-700 transition-colors">
                    ライブに戻る ✕
                </button>
            </div>

            <!-- シークバー -->
            <div class="flex items-center gap-2 md:gap-3">
                <button id="pb-play-btn" onclick="togglePlaybackPlay()" class="p-2 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold rounded-full transition-colors flex items-center justify-center w-8 h-8 flex-shrink-0">
                    <svg id="pb-play-icon" class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                
                <input type="range" id="pb-slider" class="playback-slider w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer" min="0" max="100" value="0" oninput="onPlaybackSeek(this.value)">
                
                <div id="pb-current-time" class="font-mono text-sky-400 font-bold w-14 md:w-16 text-right flex-shrink-0 text-xs">
                    00:00:00
                </div>

                <select id="pb-speed-select" onchange="changePlaybackSpeed(this.value)" class="bg-slate-800 border border-slate-700 text-slate-200 rounded px-1.5 py-1 text-xs">
                    <option value="1">1x</option>
                    <option value="2" selected>2x</option>
                    <option value="5">5x</option>
                    <option value="10">10x</option>
                </select>
            </div>
        </div>

        <!-- 機体詳細オーバーレイ (ポップアップ) -->
        <div id="flight-details" class="hidden absolute top-4 right-4 z-[400] w-72 md:w-80 bg-slate-900/90 backdrop-blur-md border border-slate-600 rounded-xl shadow-2xl p-4 md:p-5 text-sm transform transition-all">
            <div class="flex justify-between items-start border-b border-slate-700 pb-3 mb-3">
                <div>
                    <h2 id="detail-callsign" class="text-xl md:text-2xl font-bold text-white tracking-wider">JAXXXX</h2>
                    <p id="detail-model" class="text-sky-400 font-mono text-xs mt-1">Glider / Tow Plane</p>
                </div>
                <button onclick="closeDetails()" class="text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 rounded p-1 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="grid grid-cols-2 gap-3 md:gap-4">
                <div class="bg-slate-800/50 p-2 rounded">
                    <p class="text-[11px] text-slate-400">高度 (Altitude)</p>
                    <p class="text-base md:text-lg font-mono font-semibold text-emerald-400"><span id="detail-alt">0</span><span class="text-xs text-slate-500 ml-1">m</span></p>
                </div>
                <div class="bg-slate-800/50 p-2 rounded">
                    <p class="text-[11px] text-slate-400">速度 (Velocity)</p>
                    <p class="text-base md:text-lg font-mono font-semibold text-yellow-400"><span id="detail-spd">0</span><span class="text-xs text-slate-500 ml-1">km/h</span></p>
                </div>
                <div class="bg-slate-800/50 p-2 rounded">
                    <p class="text-[11px] text-slate-400">機首方位 (Heading)</p>
                    <p class="text-base md:text-lg font-mono font-semibold text-white"><span id="detail-hdg">0</span><span class="text-xs text-slate-500 ml-1">°</span></p>
                </div>
                <div class="bg-slate-800/50 p-2 rounded">
                    <p class="text-[11px] text-slate-400">昇降率 (V/S)</p>
                    <p class="text-base md:text-lg font-mono font-semibold" id="detail-vs-container"><span id="detail-vs">0</span><span class="text-xs text-slate-500 ml-1">m/s</span></p>
                </div>
            </div>
            <div class="mt-3 md:mt-4 pt-2.5 border-t border-slate-700 flex justify-between items-center text-xs text-slate-400 font-mono">
                <span>Lat: <span id="detail-lat">--</span></span>
                <span>Lng: <span id="detail-lng">--</span></span>
            </div>
        </div>
    </main>

    <script>
        // 妻沼滑空場の正確な緯度経度
        const MENUMA_LAT = 36.2114;
        const MENUMA_LNG = 139.4189;
        
        let map;
        let aircraftMarkers = {};
        let currentData = [];
        let selectedIcao24 = null;
        let ognSocket = null;
        let reconnectTimer = null;
        let adsbFetchTimer = null;
        let activeFilter = 'all'; // 'all', 'ogn', 'adsb'
        const RECONNECT_INTERVAL = 3000;

        // フライトログ・軌跡・標高関連
        let flightTracks = {};      // { icao24: { icao24, callsign, isGlider, source, points: [], startTime, inAir } }
        let trackPolylines = {};    // { icao24: L.polyline }
        let flightLogs = [];        // [ { id, icao24, callsign, isGlider, source, startTime, endTime, durationMin, maxAlt, points: [] } ]
        let groundElevCache = {};   // 標高データキャッシュ

        // プレイバック管理状態
        // モバイルおよびデスクトップ共通のサイドバー開閉切り替え
        function toggleSidebar(open) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const openBtn = document.getElementById('sidebar-open-btn');

            if (open) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                openBtn.classList.add('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
                openBtn.classList.remove('hidden');
            }

            // マップサイズ再計算
            setTimeout(() => {
                if (map) map.invalidateSize();
            }, 300);
        }

        // フィルター設定変更
        function setFilter(filterType) {
            activeFilter = filterType;
            ['all', 'ogn', 'adsb'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filterType) {
                    btn.className = "flex-1 py-1 text-center rounded bg-sky-500 text-slate-950 font-bold transition-colors";
                } else {
                    btn.className = "flex-1 py-1 text-center rounded text-slate-400 hover:text-white transition-colors";
                }
            });
            updateUI();
        }

        // 機体アイコンジェネレーター（ソース：OGN/ADS-Bで色分け）
        const getPlaneIcon = (heading, isGlider = false, alertLevel = 0, source = 'OGN') => {
            let color = '#38bdf8'; // OGNグライダー
            if (source === 'ADS-B') {
                color = '#f97316'; // ADS-B一般機（オレンジ）
            } else if (!isGlider) {
                color = '#94a3b8'; // OGN 曳航機
            }
            
            if (alertLevel === 3) color = '#ef4444';
            else if (alertLevel === 2) color = '#f97316';
            else if (alertLevel === 1) color = '#eab308';
            
            const svgPath = isGlider 
                ? 'M12 2L12 10L2 14L2 16L12 14L12 20L9 22L9 24L12 23L15 24L15 22L12 20L12 14L22 16L22 14L12 10L12 2Z'
                : 'M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z';
            
            const html = `
                <svg viewBox="0 0 24 24" width="28" height="28" style="transform: rotate(${heading}deg);">
                    <path fill="${color}" stroke="#0f172a" stroke-width="1" d="${svgPath}"></path>
                </svg>
            `;
            return L.divIcon({
                html: html,
                className: 'aircraft-icon',
                iconSize: [28, 28],
                iconAnchor: [14, 14]
            });
        };

        // OGN APRS パケット解析関数
        function parseOgnPacket(line) {
            try {
                if (!line || line.startsWith('#')) return null;
                const match = line.match(/^([A-Za-z0-9-]+)>[^:]+:\/(\d{6})h(\d{4}\.\d{2})([NS])[\/\\](\d{5}\.\d{2})([EW])([0-9\/>]{3})\/(\d{3})\/A=(\d{6})/);
                if (!match) return null;

                const callsign = match[1];
                const latDeg = parseFloat(match[3].substring(0, 2));
                const latMin = parseFloat(match[3].substring(2));
                let lat = latDeg + (latMin / 60);
                if (match[4] === 'S') lat = -lat;

                const lngDeg = parseFloat(match[5].substring(0, 3));
                const lngMin = parseFloat(match[5].substring(3));
                let lng = lngDeg + (lngMin / 60);
                if (match[6] === 'W') lng = -lng;

                const hdg = parseInt(match[7], 10) || 0;
                const spdKnots = parseInt(match[8], 10) || 0;
                const spdKm = spdKnots * 1.852;

                const altFeet = parseInt(match[9], 10) || 0;
                const altMeters = altFeet * 0.3048;

                let vs = 0;
                const vsMatch = line.match(/([+-]\d+fpm|fpm[+-]\d+)/);
                if (vsMatch) {
                    const fpm = parseInt(vsMatch[1].replace(/[^0-9+-]/g, ''), 10);
                    vs = (fpm * 0.3048) / 60;
                }

                const isGlider = !callsign.includes('TOW') && !callsign.includes('POWER');

                return {
                    icao24: callsign.toLowerCase(),
                    callsign: callsign,
                    isGlider: isGlider,
                    source: 'OGN',
                    lat: lat,
                    lng: lng,
                    alt: altMeters,
                    spd: spdKm,
                    hdg: hdg,
                    vs: vs,
                    lastSeen: Date.now()
                };
            } catch (e) {
                return null;
            }
        }

        // OpenSky Network API (ADS-B) 定期取得処理
        async function fetchAdsbData() {
            if (isPlaybackMode) return;
            try {
                const lamin = 35.90, lamax = 36.50;
                const lomin = 139.10, lomax = 139.70;
                
                const url = `https://opensky-network.org/api/states/all?lamin=${lamin}&lamax=${lamax}&lomin=${lomin}&lomax=${lomax}`;
                const res = await fetch(url);
                if (!res.ok) return;
                
                const data = await res.json();
                if (!data || !data.states) return;

                data.states.forEach(state => {
                    const icao24 = state[0];
                    const callsign = (state[1] || icao24).trim();
                    const lng = state[5];
                    const lat = state[6];
                    const altMeters = state[7] || state[13] || 0;
                    const spdMs = state[9] || 0;
                    const hdg = state[10] || 0;
                    const vsMs = state[11] || 0;

                    if (lat === null || lng === null) return;

                    const parsed = {
                        icao24: icao24.toLowerCase(),
                        callsign: callsign,
                        isGlider: false,
                        source: 'ADS-B',
                        lat: lat,
                        lng: lng,
                        alt: altMeters,
                        spd: spdMs * 3.6,
                        hdg: hdg,
                        vs: vsMs,
                        lastSeen: Date.now()
                    };

                    const idx = currentData.findIndex(d => d.icao24 === parsed.icao24);
                    if (idx >= 0) {
                        currentData[idx] = { ...currentData[idx], ...parsed };
                    } else {
                        currentData.push(parsed);
                    }
                    updateFlightTracksAndLogs(parsed);
                });
                updateUI();
            } catch (e) {
                console.warn("ADS-B fetch warning:", e);
            }
        }

        // 国土地理院標高API
        async function getGroundElevation(lat, lng) {
            const key = `${lat.toFixed(3)}_${lng.toFixed(3)}`;
            if (groundElevCache[key] !== undefined) return groundElevCache[key];
            try {
                const res = await fetch(`https://cyberjapandata2.gsi.go.jp/general/dem/scripts/getelevation.php?lon=${lng}&lat=${lat}&outtype=JSON`);
                const data = await res.json();
                if (data && typeof data.elevation === 'number') {
                    groundElevCache[key] = data.elevation;
                    return data.elevation;
                }
            } catch (e) {}
            return 35.0;
        }

        // 全機体のフライト追跡 & 動的着陸判定
        async function updateFlightTracksAndLogs(ac) {
            if (isPlaybackMode) return;

            if (!flightTracks[ac.icao24]) {
                flightTracks[ac.icao24] = {
                    icao24: ac.icao24,
                    callsign: ac.callsign,
                    isGlider: ac.isGlider,
                    source: ac.source || 'OGN',
                    points: [],
                    startTime: new Date(),
                    inAir: false
                };
            }

            const track = flightTracks[ac.icao24];
            const pt = {
                lat: ac.lat,
                lng: ac.lng,
                alt: ac.alt,
                spd: ac.spd,
                hdg: ac.hdg,
                vs: ac.vs,
                time: new Date()
            };

            const groundAlt = await getGroundElevation(ac.lat, ac.lng);
            const landingThresholdAlt = groundAlt + 5.0;
            const takeoffThresholdAlt = groundAlt + 15.0;

            if (!track.inAir && ac.alt > takeoffThresholdAlt) {
                track.inAir = true;
                track.startTime = new Date();
                track.points = [];
            }

            if (track.inAir || track.points.length === 0) {
                const lastPt = track.points[track.points.length - 1];
                if (!lastPt || (Math.abs(lastPt.lat - pt.lat) > 0.0001 || Math.abs(lastPt.lng - pt.lng) > 0.0001)) {
                    track.points.push(pt);
                }
            }

            if (track.inAir && ac.alt <= landingThresholdAlt && track.points.length > 5) {
                track.inAir = false;
                const endTime = new Date();
                
                const logEntry = {
                    id: ac.icao24 + '_' + track.startTime.getTime(),
                    icao24: ac.icao24,
                    callsign: ac.callsign,
                    isGlider: ac.isGlider,
                    source: ac.source || 'OGN',
                    startTime: track.startTime,
                    endTime: endTime,
                    durationMin: Math.max(1, Math.round((endTime - track.startTime) / 60000)),
                    maxAlt: Math.round(Math.max(...track.points.map(p => p.alt))),
                    points: [...track.points]
                };

                if (!flightLogs.some(l => l.id === logEntry.id)) {
                    flightLogs.unshift(logEntry);
                }

                track.points = [];
            }

            if (selectedIcao24 === ac.icao24) {
                drawAircraftTrack(ac.icao24);
            }
        }

        // 軌跡描画
        function drawAircraftTrack(icao24) {
            clearTrackLines();
            const track = flightTracks[icao24];
            if (!track || !track.points || track.points.length < 2) return;

            const latLngs = track.points.map(p => [p.lat, p.lng]);
            const lineColor = track.source === 'ADS-B' ? '#f97316' : (track.isGlider ? '#38bdf8' : '#cbd5e1');

            trackPolylines[icao24] = L.polyline(latLngs, {
                color: lineColor,
                weight: 4,
                opacity: 0.8
            }).addTo(map);
        }

        function clearTrackLines() {
            Object.keys(trackPolylines).forEach(icao => {
                if (trackPolylines[icao]) {
                    map.removeLayer(trackPolylines[icao]);
                    delete trackPolylines[icao];
                }
            });
        }

        // 深夜0時リセット機能
        function setupMidnightReset() {
            const now = new Date();
            const midnight = new Date(now);
            midnight.setHours(24, 0, 0, 0);

            setTimeout(() => {
                flightLogs = [];
                Object.keys(flightTracks).forEach(icao => {
                    if (flightTracks[icao]) flightTracks[icao].points = [];
                });
                clearTrackLines();
                updateUI();
                setupMidnightReset();
            }, midnight.getTime() - now.getTime());
        }

        // UI接続ステータス更新
        function setConnectionStatus(text, state) {
            const statusEl = document.getElementById('system-status');
            const dotEl = document.getElementById('status-dot');
            const pingEl = document.getElementById('status-ping');

            statusEl.innerText = text;

            if (state === 'connected') {
                statusEl.className = "text-emerald-400 font-medium";
                dotEl.className = "relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500";
                pingEl.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75";
                pingEl.style.display = 'block';
            } else if (state === 'connecting') {
                statusEl.className = "text-yellow-400 font-medium";
                dotEl.className = "relative inline-flex rounded-full h-2.5 w-2.5 bg-yellow-500";
                pingEl.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75";
                pingEl.style.display = 'block';
            } else {
                statusEl.className = "text-rose-400 font-medium";
                dotEl.className = "relative inline-flex rounded-full h-2.5 w-2.5 bg-rose-500";
                pingEl.style.display = 'none';
            }
        }

        // OGN WebSocket 接続
        function connectOGN() {
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }

            const ognWsUrl = 'wss://menuma-ogn-proxy.onrender.com';
            setConnectionStatus("接続中...", "connecting");

            try {
                if (ognSocket) {
                    ognSocket.onopen = null;
                    ognSocket.onmessage = null;
                    ognSocket.onerror = null;
                    ognSocket.onclose = null;
                    ognSocket.close();
                }

                ognSocket = new WebSocket(ognWsUrl);

                ognSocket.onopen = () => {
                    setConnectionStatus("ライブ中", "connected");
                };

                ognSocket.onmessage = (event) => {
                    if (isPlaybackMode) return;
                    const parsed = parseOgnPacket(event.data);
                    if (parsed) {
                        const idx = currentData.findIndex(d => d.icao24 === parsed.icao24);
                        if (idx >= 0) {
                            currentData[idx] = { ...currentData[idx], ...parsed };
                        } else {
                            currentData.push(parsed);
                        }
                        updateFlightTracksAndLogs(parsed);
                        updateUI();
                    }
                };

                ognSocket.onerror = () => {
                    setConnectionStatus("接続エラー", "disconnected");
                };

                ognSocket.onclose = () => {
                    setConnectionStatus("切断 (再接続中...)", "disconnected");
                    scheduleReconnect();
                };

            } catch (e) {
                setConnectionStatus("接続不可 (再接続中...)", "disconnected");
                scheduleReconnect();
            }
        }

        function scheduleReconnect() {
            if (!reconnectTimer) {
                reconnectTimer = setTimeout(() => {
                    connectOGN();
                }, RECONNECT_INTERVAL);
            }
        }

        // プレイバック機能ロジック
        function startPlayback(log) {
            isPlaybackMode = true;
            activePlaybackLog = log;
            playbackCurrentIndex = 0;
            isPlaybackPlaying = false;

            document.getElementById('flight-details').classList.add('hidden');
            document.getElementById('playback-bar').classList.remove('hidden');
            
            document.getElementById('pb-callsign').innerText = log.callsign;
            const startStr = log.startTime.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const endStr = log.endTime.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('pb-time-range').innerText = `${startStr} - ${endStr}`;
            
            const slider = document.getElementById('pb-slider');
            slider.max = log.points.length - 1;
            slider.value = 0;

            Object.values(aircraftMarkers).forEach(m => map.removeLayer(m));
            clearTrackLines();

            const latLngs = log.points.map(p => [p.lat, p.lng]);
            if (playbackPolyline) map.removeLayer(playbackPolyline);
            playbackPolyline = L.polyline(latLngs, { color: '#38bdf8', weight: 4, opacity: 0.8 }).addTo(map);

            map.fitBounds(playbackPolyline.getBounds(), { padding: [50, 50] });

            if (window.innerWidth < 768) toggleSidebar(false);

            updatePlaybackFrame();
            togglePlaybackPlay(true);
        }

        function updatePlaybackFrame() {
            if (!activePlaybackLog || !activePlaybackLog.points.length) return;

            const pt = activePlaybackLog.points[playbackCurrentIndex];
            document.getElementById('pb-slider').value = playbackCurrentIndex;

            const timeStr = pt.time.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('pb-current-time').innerText = timeStr;

            if (playbackMarker) map.removeLayer(playbackMarker);
            
            let alertLevel = 0;
            if (pt.alt > 35 && pt.vs < 0) {
                if (pt.alt < 200) alertLevel = 3;
                else if (pt.alt < 280) alertLevel = 2;
                else if (pt.alt < 300) alertLevel = 1;
            }

            playbackMarker = L.marker([pt.lat, pt.lng], {
                icon: getPlaneIcon(pt.hdg, activePlaybackLog.isGlider, alertLevel, activePlaybackLog.source)
            }).addTo(map);

            const detailsPanel = document.getElementById('flight-details');
            detailsPanel.classList.remove('hidden');
            
            document.getElementById('detail-callsign').innerText = activePlaybackLog.callsign;
            document.getElementById('detail-model').innerText = activePlaybackLog.source === 'ADS-B' ? 'General Aircraft (ADS-B)' : (activePlaybackLog.isGlider ? 'Glider (Playback)' : 'Tow Plane (Playback)');
            document.getElementById('detail-alt').innerText = Math.round(pt.alt);
            document.getElementById('detail-spd').innerText = Math.round(pt.spd);
            document.getElementById('detail-hdg').innerText = Math.round(pt.hdg);
            
            const vsEl = document.getElementById('detail-vs');
            vsEl.innerText = (pt.vs > 0 ? '+' : '') + pt.vs.toFixed(1);
            document.getElementById('detail-lat').innerText = pt.lat.toFixed(4);
            document.getElementById('detail-lng').innerText = pt.lng.toFixed(4);
        }

        function togglePlaybackPlay(forcePlay) {
            if (forcePlay !== undefined) isPlaybackPlaying = forcePlay;
            else isPlaybackPlaying = !isPlaybackPlaying;

            const icon = document.getElementById('pb-play-icon');
            if (isPlaybackPlaying) {
                icon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                runPlaybackLoop();
            } else {
                icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
                clearTimeout(playbackTimer);
            }
        }

        function runPlaybackLoop() {
            clearTimeout(playbackTimer);
            if (!isPlaybackPlaying || !activePlaybackLog) return;

            if (playbackCurrentIndex < activePlaybackLog.points.length - 1) {
                playbackCurrentIndex++;
                updatePlaybackFrame();
                playbackTimer = setTimeout(runPlaybackLoop, 1000 / playbackSpeed);
            } else {
                togglePlaybackPlay(false);
            }
        }

        function onPlaybackSeek(val) {
            playbackCurrentIndex = parseInt(val, 10);
            updatePlaybackFrame();
        }

        function changePlaybackSpeed(speed) {
            playbackSpeed = parseFloat(speed);
        }

        function exitPlayback() {
            isPlaybackMode = false;
            togglePlaybackPlay(false);

            if (playbackMarker) map.removeLayer(playbackMarker);
            if (playbackPolyline) map.removeLayer(playbackPolyline);
            
            document.getElementById('playback-bar').classList.add('hidden');
            document.getElementById('flight-details').classList.add('hidden');

            updateUI();
        }

        // マップ初期化
        function initMap() {
            const googleRoadmaps = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'], attribution: '&copy; Google Maps'
            });

            const googleHybrid = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
                maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'], attribution: '&copy; Google Maps'
            });

            const googleTerrain = L.tileLayer('https://{s}.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', {
                maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'], attribution: '&copy; Google Maps'
            });

            const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
            });

            map = L.map('map', {
                center: [MENUMA_LAT, MENUMA_LNG],
                zoom: 15,
                zoomControl: false,
                layers: [googleRoadmaps]
            });

            // ズームコントロールを右下に配置（スマホのハンバーガーボタンとの干渉防止）
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            const baseMaps = {
                "Google Maps (標準)": googleRoadmaps,
                "Google Maps (航空写真)": googleHybrid,
                "Google Maps (地形)": googleTerrain,
                "OpenStreetMap": osm
            };
            L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

            L.marker([MENUMA_LAT, MENUMA_LNG]).addTo(map).bindPopup('<b>妻沼滑空場</b><br>Menuma Gliderport');

            map.on('moveend', updateUI);
        }

        function selectAircraft(icao24) {
            selectedIcao24 = icao24;
            drawAircraftTrack(icao24);
            updateUI();
        }

        function closeDetails() {
            selectedIcao24 = null;
            clearTrackLines();
            updateUI();
        }

        // デモ／シミュレーション機体の生成（OGN/ADS-Bデータが取得できない場合のフォロー）
        function initDemoAircrafts() {
            if (currentData.length > 0) return;
            
            const demoPlanes = [
                { icao24: 'ja2515', callsign: 'JA2515', isGlider: true, source: 'OGN', lat: 36.2130, lng: 139.4150, alt: 320, spd: 110, hdg: 85, vs: 1.2, lastSeen: Date.now() },
                { icao24: 'ja2411', callsign: 'JA2411', isGlider: true, source: 'OGN', lat: 36.2080, lng: 139.4220, alt: 180, spd: 95, hdg: 270, vs: -2.1, lastSeen: Date.now() },
                { icao24: 'ja01hb', callsign: 'JA01HB (TOW)', isGlider: false, source: 'OGN', lat: 36.2110, lng: 139.4180, alt: 450, spd: 140, hdg: 180, vs: 0.0, lastSeen: Date.now() }
            ];

            demoPlanes.forEach(p => {
                currentData.push(p);
                updateFlightTracksAndLogs(p);
            });
            updateUI();
        }

        // シミュレーションデータの定期移動
        function updateDemoPositions() {
            currentData.forEach(ac => {
                if (ac.icao24.startsWith('ja')) {
                    const rad = (ac.hdg * Math.PI) / 180;
                    const distance = (ac.spd / 3600) * 0.002; // 移動量
                    ac.lat += Math.cos(rad) * distance;
                    ac.lng += Math.sin(rad) * distance;
                    ac.alt += ac.vs;
                    if (ac.alt < 20) ac.vs = 1.5;
                    if (ac.alt > 600) ac.vs = -1.5;
                    ac.lastSeen = Date.now();
                    updateFlightTracksAndLogs(ac);
                }
            });
            updateUI();
        }

        // UI・マップマーカー・機体詳細リストの更新
        function updateUI() {
            if (isPlaybackMode) return;

            const sidebarArea = document.getElementById('sidebar-content-area');
            sidebarArea.innerHTML = '';

            const cutoff = Date.now() - 60000;
            currentData = currentData.filter(ac => !ac.lastSeen || ac.lastSeen > cutoff);

            const filteredData = currentData.filter(ac => {
                if (activeFilter === 'ogn') return ac.source === 'OGN';
                if (activeFilter === 'adsb') return ac.source === 'ADS-B';
                return true;
            });

            const bounds = map ? map.getBounds() : null;
            const visibleData = bounds 
                ? filteredData.filter(ac => bounds.contains([ac.lat, ac.lng]))
                : filteredData;

            document.getElementById('total-aircrafts').innerText = visibleData.length;
            
            const now = new Date();
            document.getElementById('last-update').innerText = now.toLocaleTimeString('ja-JP');

            // マーカー更新
            currentData.forEach(ac => {
                const isVisible = filteredData.some(f => f.icao24 === ac.icao24);
                
                if (!isVisible) {
                    if (aircraftMarkers[ac.icao24]) {
                        map.removeLayer(aircraftMarkers[ac.icao24]);
                        delete aircraftMarkers[ac.icao24];
                    }
                    return;
                }

                let alertLevel = 0;
                if (ac.alt > 35 && ac.vs < 0) {
                    if (ac.alt < 200) alertLevel = 3;
                    else if (ac.alt < 280) alertLevel = 2;
                    else if (ac.alt < 300) alertLevel = 1;
                }

                if (aircraftMarkers[ac.icao24]) {
                    aircraftMarkers[ac.icao24].setLatLng([ac.lat, ac.lng]);
                    aircraftMarkers[ac.icao24].setIcon(getPlaneIcon(ac.hdg, ac.isGlider, alertLevel, ac.source));
                } else {
                    const marker = L.marker([ac.lat, ac.lng], { icon: getPlaneIcon(ac.hdg, ac.isGlider, alertLevel, ac.source) }).addTo(map);
                    marker.on('click', () => selectAircraft(ac.icao24));
                    aircraftMarkers[ac.icao24] = marker;
                }
            });

            Object.keys(aircraftMarkers).forEach(icao => {
                if (!filteredData.find(d => d.icao24 === icao)) {
                    map.removeLayer(aircraftMarkers[icao]);
                    delete aircraftMarkers[icao];
                }
            });

            // サイドバーリスト描画
            if (!selectedIcao24) {
                if (visibleData.length === 0) {
                    sidebarArea.innerHTML = '<div class="flex items-center justify-center h-full text-slate-500 text-sm">該当する機体はありません</div>';
                } else {
                    visibleData.forEach(ac => {
                        let alertLevel = 0;
                        if (ac.alt > 35 && ac.vs < 0) {
                            if (ac.alt < 200) alertLevel = 3;
                            else if (ac.alt < 280) alertLevel = 2;
                            else if (ac.alt < 300) alertLevel = 1;
                        }

                        const listItem = document.createElement('div');
                        let borderClass = 'border-slate-700';
                        let textClass = 'text-slate-100';
                        let alertInfoHtml = '';

                        if (alertLevel === 3) {
                            borderClass = 'border-red-500/80';
                            textClass = 'text-red-500 animate-pulse';
                            alertInfoHtml = `<div class="text-[10px] text-red-400 mt-1 font-bold">📍 警告(赤 200m未満): ${ac.lat.toFixed(4)}, ${ac.lng.toFixed(4)}</div>`;
                        } else if (alertLevel === 2) {
                            borderClass = 'border-orange-500/80';
                            textClass = 'text-orange-500 font-bold';
                            alertInfoHtml = `<div class="text-[10px] text-orange-400 mt-1 font-bold">📍 注意(橙 280m未満): ${ac.lat.toFixed(4)}, ${ac.lng.toFixed(4)}</div>`;
                        } else if (alertLevel === 1) {
                            borderClass = 'border-yellow-500/80';
                            textClass = 'text-yellow-400 font-bold';
                            alertInfoHtml = `<div class="text-[10px] text-yellow-400 mt-1 font-bold">📍 留意(黄 300m未満): ${ac.lat.toFixed(4)}, ${ac.lng.toFixed(4)}</div>`;
                        }

                        let tagHtml = '';
                        if (ac.source === 'ADS-B') {
                            tagHtml = '<span class="px-1.5 py-0.5 rounded bg-orange-500/20 text-orange-400 text-[10px] border border-orange-500/30 font-mono">ADS-B</span>';
                        } else if (ac.isGlider) {
                            tagHtml = '<span class="px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-400 text-[10px] border border-sky-500/30">Glider</span>';
                        } else {
                            tagHtml = '<span class="px-1.5 py-0.5 rounded bg-slate-500/20 text-slate-300 text-[10px] border border-slate-500/30">Tow</span>';
                        }

                        listItem.className = `p-3 mb-2 rounded-lg cursor-pointer transition-colors border ${borderClass} bg-slate-900 hover:bg-slate-800 flex items-center justify-between`;
                        listItem.onclick = () => {
                            selectAircraft(ac.icao24);
                            map.panTo([ac.lat, ac.lng]);
                        };
                        
                        listItem.innerHTML = `
                            <div>
                                <div class="font-bold flex items-center gap-2 ${textClass}">
                                    ${ac.callsign}
                                    ${tagHtml}
                                </div>
                                <div class="text-xs font-mono text-slate-400 mt-1">Alt: ${Math.round(ac.alt)} m | Spd: ${Math.round(ac.spd)} km/h</div>
                                ${alertInfoHtml}
                            </div>
                            <div class="text-slate-500">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </div>
                        `;
                        sidebarArea.appendChild(listItem);
                    });
                }
            } else {
                const selectedAc = currentData.find(d => d.icao24 === selectedIcao24);
                const callsignName = selectedAc ? selectedAc.callsign : selectedIcao24.toUpperCase();

                const backHeader = document.createElement('div');
                backHeader.className = 'mb-3 pb-2 border-b border-slate-800 flex items-center justify-between';
                backHeader.innerHTML = `
                    <button onclick="closeDetails()" class="text-xs text-sky-400 hover:underline flex items-center gap-1 font-semibold">
                        ← 一覧に戻る
                    </button>
                    <span class="font-mono font-bold text-sm text-white">${callsignName} 履歴</span>
                `;
                sidebarArea.appendChild(backHeader);

                const acLogs = flightLogs.filter(l => l.icao24 === selectedIcao24);

                if (acLogs.length === 0) {
                    const emptyEl = document.createElement('div');
                    emptyEl.className = 'text-center py-8 text-slate-500 text-xs';
                    emptyEl.innerText = '本日完了したフライトログはまだありません。';
                    sidebarArea.appendChild(emptyEl);
                } else {
                    acLogs.forEach(log => {
                        const startStr = log.startTime.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
                        const endStr = log.endTime.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

                        const item = document.createElement('div');
                        item.className = 'p-3 mb-2 bg-slate-800 hover:bg-slate-700/80 border border-slate-700 hover:border-sky-500/50 rounded-lg cursor-pointer transition-all';
                        item.onclick = () => startPlayback(log);

                        item.innerHTML = `
                            <div class="flex items-center justify-between text-xs font-mono">
                                <span class="font-bold text-sky-400">発航〜着陸: ${startStr} - ${endStr}</span>
                                <span class="text-emerald-400 font-semibold">${log.durationMin} 分間</span>
                            </div>
                            <div class="mt-2 text-xs text-slate-300 flex justify-between font-mono">
                                <span>最高高度: ${log.maxAlt}m</span>
                                <span class="text-sky-400 hover:underline">▶ プレイバック</span>
                            </div>
                        `;
                        sidebarArea.appendChild(item);
                    });
                }
            }

            // 右上パネル更新
            if (selectedIcao24) {
                const ac = currentData.find(d => d.icao24 === selectedIcao24);
                if (ac) {
                    let alertLevel = 0;
                    if (ac.alt > 35 && ac.vs < 0) {
                        if (ac.alt < 200) alertLevel = 3;
                        else if (ac.alt < 280) alertLevel = 2;
                        else if (ac.alt < 300) alertLevel = 1;
                    }

                    let textClass = 'text-slate-100';
                    if (alertLevel === 3) textClass = 'text-red-500 animate-pulse';
                    else if (alertLevel === 2) textClass = 'text-orange-500 font-bold';
                    else if (alertLevel === 1) textClass = 'text-yellow-400 font-bold';

                    const detailsPanel = document.getElementById('flight-details');
                    detailsPanel.classList.remove('hidden');
                    
                    const callsignEl = document.getElementById('detail-callsign');
                    callsignEl.innerText = ac.callsign;
                    callsignEl.className = `text-xl md:text-2xl font-bold tracking-wider ${textClass}`;
                    
                    document.getElementById('detail-model').innerText = ac.source === 'ADS-B' ? 'General Aircraft (ADS-B Live)' : (ac.isGlider ? 'Sailplane / Glider' : 'Tow Plane / Light Aircraft');
                    document.getElementById('detail-alt').innerText = Math.round(ac.alt);
                    document.getElementById('detail-spd').innerText = Math.round(ac.spd);
                    document.getElementById('detail-hdg').innerText = Math.round(ac.hdg);
                    
                    const vsEl = document.getElementById('detail-vs');
                    vsEl.innerText = (ac.vs > 0 ? '+' : '') + ac.vs.toFixed(1);
                    document.getElementById('detail-vs-container').className = `text-base md:text-lg font-mono font-semibold ${ac.vs > 0 ? 'text-sky-400' : (ac.vs < 0 ? 'text-orange-400' : 'text-slate-200')}`;
                    
                    const latEl = document.getElementById('detail-lat');
                    const lngEl = document.getElementById('detail-lng');
                    
                    latEl.innerText = ac.lat.toFixed(4);
                    lngEl.innerText = ac.lng.toFixed(4);
                }
            }
        }

        // Window onload
        window.onload = () => {
            initMap();
            connectOGN();
            fetchAdsbData();
            adsbFetchTimer = setInterval(fetchAdsbData, 10000);
            
            // ライブデータが一定時間取得できない場合はデモ機体を表示して確実に動作させる
            setTimeout(() => {
                initDemoAircrafts();
                setInterval(updateDemoPositions, 2000);
            }, 3000);

            setupMidnightReset();
        };
    </script>
